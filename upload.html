<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoltX – Upload</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body {
      min-height:100vh;
      background: radial-gradient(circle at 30% 20%, #0e0b2a, #04030e);
      padding:1.5rem;
      color:#f0eeff;
    }
    .container {
      max-width:1200px;
      margin:0 auto;
    }
    .header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:1rem 2rem;
      background:rgba(16,14,40,0.78);
      backdrop-filter:blur(16px);
      border:1px solid rgba(120,80,255,0.3);
      border-radius:40px;
      margin-bottom:2rem;
      flex-wrap:wrap;
      gap:1rem;
    }
    .brand { font-size:1.8rem; font-weight:800; background:linear-gradient(135deg,#a78bfa,#7c3aed,#4f46e5); -webkit-background-clip:text; background-clip:text; color:transparent; cursor:pointer; }
    .brand:hover { opacity:0.8; }
    .user-area { display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; }
    .user-name { font-weight:600; color:#c4b5fd; }
    .coins-badge { background:rgba(124,58,237,0.2); padding:6px 16px; border-radius:40px; border:1px solid #7c3aed; font-weight:700; color:#a78bfa; }
    .btn-logout { background:#ef4444; border:none; color:white; padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:600; transition:0.25s; }
    .btn-logout:hover { background:#dc2626; transform:scale(1.05); }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 40px;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid #4f46e5;
      transition: 0.25s;
    }
    .nav-links a:hover {
      background: #7c3aed;
      color: white;
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
    }
    .nav-links a.active {
      background: #7c3aed;
      color: white;
    }

    .content {
      background: rgba(10, 8, 30, 0.4);
      border-radius: 28px;
      padding: 2rem;
      border: 1px solid #1a1540;
    }
    .content h3 {
      color: #a78bfa;
      margin-bottom: 1.5rem;
    }

    .upload-form {
      background: rgba(10, 8, 30, 0.6);
      border-radius: 28px;
      padding: 2rem;
      border: 1px solid #2a235a;
      max-width: 700px;
      margin: 0 auto;
    }
    .upload-form input,
    .upload-form textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(8, 6, 28, 0.8);
      border: 1.5px solid #2a235a;
      border-radius: 32px;
      font-size: 0.95rem;
      color: #f0eeff;
      outline: none;
      margin-bottom: 0.8rem;
      font-family: inherit;
    }
    .upload-form textarea {
      min-height: 80px;
      resize: vertical;
      border-radius: 20px;
    }
    .upload-form input:focus,
    .upload-form textarea:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
    }
    .upload-form .upload-row {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .upload-form .upload-row input {
      flex: 1;
      min-width: 160px;
    }
    .upload-form button {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      color: white;
      padding: 12px 28px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.25s;
      white-space: nowrap;
    }
    .upload-form button:hover {
      transform: scale(1.04);
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.4);
    }
    #uploadStatus {
      margin-top: 10px;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(0,0,0,0.3);
    }
    #uploadStatus.success {
      color: #a7f3d0;
      border-left: 4px solid #34d399;
    }
    #uploadStatus.error {
      color: #fca5a5;
      border-left: 4px solid #f87171;
    }

    @media (max-width:600px) {
      .header { flex-direction:column; align-items:stretch; }
      .user-area { justify-content:space-between; }
      .nav-links a { padding:6px 14px; font-size:0.85rem; }
      .content { padding:1rem; }
      .upload-form { padding:1rem; }
      .upload-form .upload-row { flex-direction:column; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand" onclick="window.location.href='dashboard.html'">⚡ VoltX</div>
    <div class="user-area">
      <span class="user-name" id="userName">Laden...</span>
      <span class="coins-badge" id="userCoins">🪙 0</span>
      <button class="btn-logout" id="logoutBtn">🚪 Logout</button>
    </div>
  </div>

  <div class="nav-links">
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="shop.html">🛒 V$ Shop</a>
    <a href="upload.html" class="active">📤 Upload</a>
    <a href="members.html">👥 Member</a>
    <a href="profile.html">👤 Profil</a>
  </div>

  <div class="content">
    <h3>📤 Eigenen Hack / Cheat hochladen</h3>
    <div class="upload-form">
      <input type="text" id="itemName" placeholder="Name (z.B. Aimbot Pro) *" />
      <div class="upload-row">
        <input type="number" id="itemPrice" placeholder="Preis in Volt Coins *" />
        <input type="url" id="itemDownload" placeholder="Download-Link (Mega, Google Drive) *" />
        <input type="url" id="itemVirusTotal" placeholder="VirusTotal-Link zur Prüfung *" />
      </div>
      <textarea id="itemDescription" placeholder="Beschreibung (was macht der Hack? wie benutzt man ihn?) *"></textarea>
      <button id="uploadBtn">🚀 Hochladen</button>
      <div id="uploadStatus"></div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:5000/api';
  let currentUser = null;

  function apiFetch(endpoint, options = {}) {
    return fetch(`${API_URL}${endpoint}`, {
      ...options,
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      }
    }).then(res => {
      if (res.status === 401) {
        window.location.href = 'login.html';
        return Promise.reject('Unauthorized');
      }
      return res.json();
    });
  }

  async function loadUser() {
    try {
      const data = await apiFetch('/protected/dashboard');
      if (data.success) {
        currentUser = data.user;
        document.getElementById('userName').textContent = data.user.username;
        document.getElementById('userCoins').innerHTML = `🪙 ${data.user.voltCoins}`;
      }
    } catch (err) {
      console.error('Load User Error:', err);
      window.location.href = 'login.html';
    }
  }

  document.getElementById('uploadBtn').addEventListener('click', async () => {
    const name = document.getElementById('itemName').value.trim();
    const price = parseFloat(document.getElementById('itemPrice').value);
    const downloadLink = document.getElementById('itemDownload').value.trim();
    const virusTotalLink = document.getElementById('itemVirusTotal').value.trim();
    const description = document.getElementById('itemDescription').value.trim();
    const statusDiv = document.getElementById('uploadStatus');

    statusDiv.className = '';
    statusDiv.textContent = '⏳ Wird hochgeladen...';

    if (!name) { statusDiv.className = 'error'; statusDiv.textContent = '❌ Name ist Pflicht.'; return; }
    if (!price || isNaN(price) || price <= 0) { statusDiv.className = 'error'; statusDiv.textContent = '❌ Preis muss positiv sein.'; return; }
    if (!downloadLink) { statusDiv.className = 'error'; statusDiv.textContent = '❌ Download-Link ist Pflicht.'; return; }
    if (!virusTotalLink) { statusDiv.className = 'error'; statusDiv.textContent = '❌ VirusTotal-Link ist Pflicht.'; return; }
    if (!description) { statusDiv.className = 'error'; statusDiv.textContent = '❌ Beschreibung ist Pflicht.'; return; }
    if (name.length < 3) { statusDiv.className = 'error'; statusDiv.textContent = '❌ Name mind. 3 Zeichen.'; return; }
    if (description.length < 10) { statusDiv.className = 'error'; statusDiv.textContent = '❌ Beschreibung mind. 10 Zeichen.'; return; }

    try {
      const data = await apiFetch('/shop/upload', {
        method: 'POST',
        body: JSON.stringify({ name, price, downloadLink, virusTotalLink, description })
      });
      
      if (data.success) {
        statusDiv.className = 'success';
        statusDiv.textContent = '✅ ' + data.message;
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemDownload').value = '';
        document.getElementById('itemVirusTotal').value = '';
        document.getElementById('itemDescription').value = '';
      } else {
        statusDiv.className = 'error';
        statusDiv.textContent = '❌ ' + data.message;
      }
    } catch (err) {
      statusDiv.className = 'error';
      statusDiv.textContent = '❌ Serverfehler: ' + err.message;
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch(`${API_URL}/auth/logout`, {
      method: 'POST',
      credentials: 'include'
    });
    window.location.href = 'login.html';
  });

  if (!document.cookie.includes('token')) {
    window.location.href = 'login.html';
  } else {
    loadUser();
  }
</script>
</body>
</html>
