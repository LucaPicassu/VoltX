<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoltX – Profil</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body {
      min-height:100vh;
      background: radial-gradient(circle at 30% 20%, #0e0b2a, #04030e);
      padding:1.5rem;
      color:#f0eeff;
    }
    .container {
      max-width:1200px;
      margin:0 auto;
    }
    .header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:1rem 2rem;
      background:rgba(16,14,40,0.78);
      backdrop-filter:blur(16px);
      border:1px solid rgba(120,80,255,0.3);
      border-radius:40px;
      margin-bottom:2rem;
      flex-wrap:wrap;
      gap:1rem;
    }
    .brand { font-size:1.8rem; font-weight:800; background:linear-gradient(135deg,#a78bfa,#7c3aed,#4f46e5); -webkit-background-clip:text; background-clip:text; color:transparent; cursor:pointer; }
    .brand:hover { opacity:0.8; }
    .user-area { display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; }
    .user-name { font-weight:600; color:#c4b5fd; }
    .coins-badge { background:rgba(124,58,237,0.2); padding:6px 16px; border-radius:40px; border:1px solid #7c3aed; font-weight:700; color:#a78bfa; }
    .btn-logout { background:#ef4444; border:none; color:white; padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:600; transition:0.25s; }
    .btn-logout:hover { background:#dc2626; transform:scale(1.05); }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 40px;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid #4f46e5;
      transition: 0.25s;
    }
    .nav-links a:hover {
      background: #7c3aed;
      color: white;
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
    }
    .nav-links a.active {
      background: #7c3aed;
      color: white;
    }

    .content {
      background: rgba(10, 8, 30, 0.4);
      border-radius: 28px;
      padding: 2rem;
      border: 1px solid #1a1540;
    }
    .content h3 {
      color: #a78bfa;
      margin-bottom: 1.5rem;
    }

    .profile-card {
      background: rgba(10, 8, 30, 0.6);
      border: 1px solid #2a235a;
      border-radius: 28px;
      padding: 2rem;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }
    .avatar-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      border: 3px solid #7c3aed;
      overflow: hidden;
      background: #1a1540;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
    }
    .avatar-container:hover { border-color: #a78bfa; transform: scale(1.05); }
    .avatar-container img { width:100%; height:100%; object-fit:cover; }
    .avatar-container .avatar-placeholder { font-size:3rem; color:#6b6190; }
    .avatar-upload-btn {
      display:block;
      margin:-0.5rem auto 1.5rem;
      background:rgba(124,58,237,0.2);
      border:1px solid #7c3aed;
      color:#a78bfa;
      padding:6px 20px;
      border-radius:40px;
      cursor:pointer;
      font-size:0.85rem;
      transition:0.25s;
    }
    .avatar-upload-btn:hover { background:#7c3aed; color:white; }

    .profile-field {
      margin: 1.5rem 0;
      text-align: left;
    }
    .profile-field label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9ca3cf;
      margin-bottom: 4px;
    }
    .profile-field input,
    .profile-field textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(8, 6, 28, 0.8);
      border: 1.5px solid #2a235a;
      border-radius: 16px;
      color: #f0eeff;
      font-size: 1rem;
      outline: none;
      transition: 0.25s;
      font-family: inherit;
    }
    .profile-field textarea { resize: vertical; min-height: 80px; }
    .profile-field input:focus,
    .profile-field textarea:focus { border-color: #8b5cf6; box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2); }
    .profile-field .hint {
      font-size: 0.75rem;
      color: #6b6190;
      margin-top: 4px;
    }
    .profile-field .hint.error { color: #f87171; }

    .btn-save {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      color: white;
      padding: 12px 40px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.25s;
      margin-top: 0.5rem;
    }
    .btn-save:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(124, 58, 237, 0.4); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .status-msg {
      margin-top: 1rem;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
    }
    .status-msg.success { display: block; background: rgba(52, 211, 153, 0.15); color: #a7f3d0; border-left: 4px solid #34d399; }
    .status-msg.error { display: block; background: rgba(248, 113, 113, 0.15); color: #fca5a5; border-left: 4px solid #f87171; }
    .status-msg.info { display: block; background: rgba(124, 58, 237, 0.15); color: #c4b5fd; border-left: 4px solid #7c3aed; }

    .cooldown-info {
      background: rgba(124, 58, 237, 0.1);
      border: 1px solid #4f46e5;
      border-radius: 16px;
      padding: 12px 16px;
      margin: 12px 0;
      font-size: 0.9rem;
      color: #a78bfa;
    }
    .admin-badge-small {
      display: inline-block;
      background: #7c3aed;
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-left: 8px;
    }

    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    .status-dot.online {
      background: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #9ca3cf;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    #avatarInput { display: none; }

    @media (max-width:600px) {
      .header { flex-direction:column; align-items:stretch; }
      .user-area { justify-content:space-between; }
      .nav-links a { padding:6px 14px; font-size:0.85rem; }
      .content { padding:1rem; }
      .profile-card { padding:1.5rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand" onclick="window.location.href='dashboard.html'">⚡ VoltX</div>
    <div class="user-area">
      <span class="user-name" id="userName">Laden...</span>
      <span class="coins-badge" id="userCoins">🪙 0</span>
      <button class="btn-logout" id="logoutBtn">🚪 Logout</button>
    </div>
  </div>

  <div class="nav-links">
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="shop.html">🛒 V$ Shop</a>
    <a href="upload.html">📤 Upload</a>
    <a href="members.html">👥 Member</a>
    <a href="profile.html" class="active">👤 Profil</a>
  </div>

  <div class="content">
    <h3>👤 Profil</h3>
    <div class="profile-card">
      <div id="adminBadge" style="display:none; margin-bottom:1rem;">
        <span class="admin-badge-small">👑 Admin</span>
      </div>

      <div class="avatar-container" id="avatarContainer" title="Bild klicken zum Ändern">
        <img id="avatarPreview" src="" style="display:none;" alt="Avatar" />
        <span class="avatar-placeholder" id="avatarPlaceholder">👤</span>
      </div>
      <button class="avatar-upload-btn" id="avatarUploadBtn">📷 Bild ändern</button>
      <input type="file" id="avatarInput" accept="image/*" />

      <div class="status-row">
        <span class="status-dot online"></span>
        <span id="profileStatus">Online</span>
      </div>

      <div class="profile-field">
        <label>👤 Benutzername</label>
        <input type="text" id="usernameInput" />
        <div class="hint" id="usernameHint">✏️ Nur alle 7 Tage änderbar</div>
        <button class="btn-save" id="saveUsernameBtn">Name speichern</button>
      </div>

      <div class="profile-field">
        <label>📝 Bio</label>
        <textarea id="bioInput" placeholder="Schreib was über dich..."></textarea>
        <div class="hint" id="bioHint">Max. 200 Zeichen</div>
        <button class="btn-save" id="saveBioBtn">Bio speichern</button>
      </div>

      <div id="statusMsg" class="status-msg"></div>
      <div id="cooldownInfo" class="cooldown-info" style="display:none;"></div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:5000/api';
  let currentUser = null;
  let profileData = null;

  function apiFetch(endpoint, options = {}) {
    return fetch(`${API_URL}/profile${endpoint}`, {
      ...options,
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      }
    }).then(res => {
      if (res.status === 401) {
        window.location.href = 'login.html';
        return Promise.reject('Unauthorized');
      }
      return res.json();
    });
  }

  async function loadUser() {
    try {
      const data = await apiFetch('/me');
      if (data.success) {
        profileData = data.profile;
        document.getElementById('userName').textContent = data.profile.username;
        document.getElementById('userCoins').innerHTML = `🪙 ${data.profile.voltCoins}`;
        
        if (data.profile.isAdmin) {
          document.getElementById('adminBadge').style.display = 'block';
        }

        document.getElementById('usernameInput').value = data.profile.username;
        document.getElementById('bioInput').value = data.profile.bio || '';
        
        if (data.profile.avatar && data.profile.avatar.startsWith('data:image/')) {
          document.getElementById('avatarPreview').src = data.profile.avatar;
          document.getElementById('avatarPreview').style.display = 'block';
          document.getElementById('avatarPlaceholder').style.display = 'none';
        } else {
          document.getElementById('avatarPreview').style.display = 'none';
          document.getElementById('avatarPlaceholder').style.display = 'block';
        }

        document.getElementById('profileStatus').textContent = 'Online';
        document.getElementById('profileStatus').style.color = '#34d399';

        checkCooldown();
      }
    } catch (err) {
      console.error('Load User Error:', err);
    }
  }

  function checkCooldown() {
    const cooldownDiv = document.getElementById('cooldownInfo');
    const lastChange = profileData?.lastNameChange;
    
    if (lastChange) {
      const last = new Date(lastChange);
      const now = new Date();
      const daysSince = (now - last) / (1000 * 60 * 60 * 24);
      
      if (daysSince < 7) {
        const remaining = Math.ceil(7 - daysSince);
        cooldownDiv.style.display = 'block';
        cooldownDiv.innerHTML = `⏳ Name kann erst in <strong>${remaining} Tag(en)</strong> wieder geändert werden.`;
        document.getElementById('saveUsernameBtn').disabled = true;
        document.getElementById('usernameInput').disabled = true;
        document.getElementById('usernameHint').textContent = `⏳ Noch ${remaining} Tage warten`;
        document.getElementById('usernameHint').className = 'hint error';
        return;
      }
    }
    
    cooldownDiv.style.display = 'none';
    document.getElementById('saveUsernameBtn').disabled = false;
    document.getElementById('usernameInput').disabled = false;
    document.getElementById('usernameHint').textContent = '✏️ Nur alle 7 Tage änderbar';
    document.getElementById('usernameHint').className = 'hint';
  }

  function setStatus(msg, type = 'info') {
    const div = document.getElementById('statusMsg');
    div.textContent = msg;
    div.className = 'status-msg ' + type;
    div.style.display = 'block';
    setTimeout(() => { div.style.display = 'none'; }, 5000);
  }

  document.getElementById('avatarUploadBtn').addEventListener('click', () => {
    document.getElementById('avatarInput').click();
  });

  document.getElementById('avatarContainer').addEventListener('click', () => {
    document.getElementById('avatarInput').click();
  });

  document.getElementById('avatarInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      setStatus('❌ Bitte ein Bild hochladen.', 'error');
      return;
    }

    if (file.size > 2 * 1024 * 1024) {
      setStatus('❌ Bild max. 2MB.', 'error');
      return;
    }

    const reader = new FileReader();
    reader.onload = async (event) => {
      const base64 = event.target.result;
      
      try {
        const data = await apiFetch('/avatar', {
          method: 'POST',
          body: JSON.stringify({ avatar: base64 })
        });
        
        if (data.success) {
          document.getElementById('avatarPreview').src = data.avatar;
          document.getElementById('avatarPreview').style.display = 'block';
          document.getElementById('avatarPlaceholder').style.display = 'none';
          setStatus('✅ Avatar aktualisiert!', 'success');
        } else {
          setStatus(data.message || '❌ Avatar Upload fehlgeschlagen.', 'error');
        }
      } catch (err) {
        setStatus('❌ Serverfehler.', 'error');
      }
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('saveBioBtn').addEventListener('click', async () => {
    const bio = document.getElementById('bioInput').value.trim();
    if (bio.length > 200) { setStatus('❌ Bio max. 200 Zeichen.', 'error'); return; }

    try {
      const data = await apiFetch('/bio', {
        method: 'POST',
        body: JSON.stringify({ bio })
      });
      
      if (data.success) {
        setStatus('✅ Bio aktualisiert!', 'success');
      } else {
        setStatus(data.message || '❌ Fehler beim Speichern.', 'error');
      }
    } catch (err) {
      setStatus('❌ Serverfehler.', 'error');
    }
  });

  document.getElementById('saveUsernameBtn').addEventListener('click', async () => {
    const newUsername = document.getElementById('usernameInput').value.trim();
    if (!newUsername) { setStatus('❌ Name darf nicht leer sein.', 'error'); return; }
    if (newUsername.length < 3) { setStatus('❌ Name mind. 3 Zeichen.', 'error'); return; }
    if (newUsername.length > 20) { setStatus('❌ Name max. 20 Zeichen.', 'error'); return; }

    if (!confirm(`Name wirklich zu "${newUsername}" ändern? (Nur alle 7 Tage möglich!)`)) return;

    try {
      const data = await apiFetch('/username', {
        method: 'POST',
        body: JSON.stringify({ newUsername })
      });
      
      if (data.success) {
        setStatus(data.message, 'success');
        document.getElementById('userName').textContent = newUsername;
        checkCooldown();
      } else {
        setStatus(data.message || '❌ Fehler beim Speichern.', 'error');
      }
    } catch (err) {
      setStatus('❌ Serverfehler.', 'error');
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch(`${API_URL}/auth/logout`, {
      method: 'POST',
      credentials: 'include'
    });
    window.location.href = 'login.html';
  });

  if (!document.cookie.includes('token')) {
    window.location.href = 'login.html';
  } else {
    loadUser();
  }
</script>
</body>
</html>
