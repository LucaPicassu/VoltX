<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoltX – Members</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body {
      min-height:100vh;
      background: radial-gradient(circle at 30% 20%, #0e0b2a, #04030e);
      padding:1.5rem;
      color:#f0eeff;
    }
    .container {
      max-width:1200px;
      margin:0 auto;
    }
    .header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:1rem 2rem;
      background:rgba(16,14,40,0.78);
      backdrop-filter:blur(16px);
      border:1px solid rgba(120,80,255,0.3);
      border-radius:40px;
      margin-bottom:2rem;
      flex-wrap:wrap;
      gap:1rem;
    }
    .brand { font-size:1.8rem; font-weight:800; background:linear-gradient(135deg,#a78bfa,#7c3aed,#4f46e5); -webkit-background-clip:text; background-clip:text; color:transparent; cursor:pointer; }
    .brand:hover { opacity:0.8; }
    .user-area { display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; }
    .user-name { font-weight:600; color:#c4b5fd; }
    .coins-badge { background:rgba(124,58,237,0.2); padding:6px 16px; border-radius:40px; border:1px solid #7c3aed; font-weight:700; color:#a78bfa; }
    .btn-logout { background:#ef4444; border:none; color:white; padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:600; transition:0.25s; }
    .btn-logout:hover { background:#dc2626; transform:scale(1.05); }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 40px;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid #4f46e5;
      transition: 0.25s;
    }
    .nav-links a:hover {
      background: #7c3aed;
      color: white;
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
    }
    .nav-links a.active {
      background: #7c3aed;
      color: white;
    }

    .content {
      background: rgba(10, 8, 30, 0.4);
      border-radius: 28px;
      padding: 2rem;
      border: 1px solid #1a1540;
    }
    .content h3 {
      color: #a78bfa;
      margin-bottom: 1.5rem;
    }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }
    .member-card {
      background: rgba(10, 8, 30, 0.6);
      border-radius: 20px;
      padding: 1rem 0.8rem;
      border: 1px solid #2a235a;
      color: #f0eeff;
      text-align: center;
      transition: 0.25s;
      position: relative;
    }
    .member-card:hover {
      border-color: #7c3aed;
      transform: translateY(-3px);
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.15);
    }
    .member-card .avatar-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #7c3aed;
      margin: 0 auto 6px;
      display: block;
      background: #1a1540;
    }
    .member-card .avatar-placeholder {
      font-size: 2.2rem;
      margin-bottom: 4px;
      display: block;
    }
    .member-card .mname {
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .member-card .mcoins {
      color: #a78bfa;
      font-size: 0.75rem;
      margin-top: 2px;
    }
    .member-card .mrole {
      font-size: 0.6rem;
      color: #9ca3cf;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
      background: rgba(124, 58, 237, 0.15);
      padding: 2px 10px;
      border-radius: 20px;
      display: inline-block;
    }
    .member-card .mrole.admin {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }
    .member-card .mbio {
      font-size: 0.65rem;
      color: #6b6190;
      margin-top: 4px;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
      animation: pulse 2s infinite;
    }
    .status-dot.online {
      background: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
    }
    .status-dot.offline {
      background: #6b6190;
      animation: none;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .member-card .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.65rem;
      color: #9ca3cf;
      margin-top: 4px;
    }

    .online-count {
      color: #34d399;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .online-count span {
      font-weight: 700;
    }

    @media (max-width:600px) {
      .header { flex-direction:column; align-items:stretch; }
      .user-area { justify-content:space-between; }
      .nav-links a { padding:6px 14px; font-size:0.85rem; }
      .content { padding:1rem; }
      .member-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .member-card { padding:0.8rem 0.5rem; }
      .member-card .avatar-img { width:40px; height:40px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand" onclick="window.location.href='dashboard.html'">⚡ VoltX</div>
    <div class="user-area">
      <span class="user-name" id="userName">Laden...</span>
      <span class="coins-badge" id="userCoins">🪙 0</span>
      <button class="btn-logout" id="logoutBtn">🚪 Logout</button>
    </div>
  </div>

  <div class="nav-links">
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="shop.html">🛒 V$ Shop</a>
    <a href="upload.html">📤 Upload</a>
    <a href="members.html" class="active">👥 Member</a>
    <a href="profile.html">👤 Profil</a>
  </div>

  <div class="content">
    <h3>👥 Alle Mitglieder</h3>
    <div class="online-count" id="onlineCount">🟢 <span id="onlineCountNumber">0</span> Mitglieder online</div>
    <div class="member-grid" id="memberGrid">
      <p style="color:#9ca3cf; grid-column:1/-1; text-align:center;">⏳ Lade Mitglieder...</p>
    </div>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:5000/api';
  let currentUser = null;
  let refreshInterval = null;

  function apiFetch(endpoint, options = {}) {
    return fetch(`${API_URL}${endpoint}`, {
      ...options,
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      }
    }).then(res => {
      if (res.status === 401) {
        window.location.href = 'login.html';
        return Promise.reject('Unauthorized');
      }
      return res.json();
    });
  }

  async function loadUser() {
    try {
      const data = await apiFetch('/protected/dashboard');
      if (data.success) {
        currentUser = data.user;
        document.getElementById('userName').textContent = data.user.username;
        document.getElementById('userCoins').innerHTML = `🪙 ${data.user.voltCoins}`;
        loadMembers();
        
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(loadMembers, 30000);
      }
    } catch (err) {
      console.error('Load User Error:', err);
      window.location.href = 'login.html';
    }
  }

  async function loadMembers() {
    try {
      const data = await apiFetch('/protected/allusers');
      if (data.success) {
        const users = data.users;
        const sorted = users.sort((a, b) => b.voltCoins - a.voltCoins);
        const grid = document.getElementById('memberGrid');
        
        const onlineUsers = users.filter(u => u.isOnline);
        document.getElementById('onlineCountNumber').textContent = onlineUsers.length;

        if (sorted.length === 0) {
          grid.innerHTML = `<p style="color:#9ca3cf; grid-column:1/-1; text-align:center;">👥 Noch keine Mitglieder.</p>`;
          return;
        }

        grid.innerHTML = sorted.map(u => {
          const isAdmin = u.username === 'LucaPicassu';
          const hasAvatar = u.avatar && u.avatar.startsWith('data:image/');
          const statusText = u.isOnline ? 'Online' : 'Offline';
          const statusClass = u.isOnline ? 'online' : 'offline';
          
          return `
            <div class="member-card">
              ${hasAvatar 
                ? `<img class="avatar-img" src="${u.avatar}" alt="${u.username}" />`
                : `<span class="avatar-placeholder">${isAdmin ? '👑' : '👤'}</span>`
              }
              <div class="mname">${u.username}</div>
              <div class="mcoins">🪙 ${u.voltCoins}</div>
              <div class="mrole ${isAdmin ? 'admin' : ''}">${isAdmin ? 'ADMIN' : 'USER'}</div>
              <div class="mbio">${u.bio || 'Keine Bio'}</div>
              <div class="status-row">
                <span class="status-dot ${statusClass}"></span>
                ${statusText}
              </div>
            </div>
          `;
        }).join('');
      }
    } catch (err) {
      console.error('Member Load Error:', err);
      document.getElementById('memberGrid').innerHTML = `<p style="color:#fca5a5; grid-column:1/-1; text-align:center;">❌ Fehler beim Laden.</p>`;
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch(`${API_URL}/auth/logout`, {
      method: 'POST',
      credentials: 'include'
    });
    if (refreshInterval) clearInterval(refreshInterval);
    window.location.href = 'login.html';
  });

  if (!document.cookie.includes('token')) {
    window.location.href = 'login.html';
  } else {
    loadUser();
  }
</script>
</body>
</html>
