<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoltX – Login</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: radial-gradient(circle at 30% 20%, #0e0b2a, #04030e);
      padding:1.5rem;
    }
    .login-card {
      background: rgba(16,14,40,0.78); backdrop-filter:blur(16px) saturate(180%);
      border:1px solid rgba(120,80,255,0.3); border-radius:56px;
      padding:3.2rem 3rem; max-width:480px; width:100%;
      box-shadow:0 40px 80px rgba(0,0,0,0.9), 0 0 0 1px rgba(130,70,255,0.2) inset;
      transition:0.3s;
    }
    .login-card:hover { transform:scale(1.01); box-shadow:0 50px 100px rgba(70,30,220,0.5), 0 0 0 2px rgba(150,100,255,0.3) inset; }
    .brand { display:flex; align-items:center; gap:10px; font-size:2.4rem; font-weight:800; letter-spacing:-1px;
      background:linear-gradient(135deg,#a78bfa,#7c3aed,#4f46e5,#7c3aed); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:0.2rem; }
    .brand span { font-size:2.2rem; background:none; color:#c4b5fd; }
    .subhead { color:#a09bcb; font-size:0.95rem; margin-bottom:2.5rem; border-left:4px solid #7c3aed; padding-left:16px; opacity:0.85; }
    .input-group { margin-bottom:1.8rem; }
    .input-group label { display:block; font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:#b9b0e6; margin-bottom:6px; }
    .input-group input { width:100%; padding:16px 20px; background:rgba(8,6,28,0.8); border:1.5px solid #2a235a; border-radius:32px; font-size:1rem; color:#f0eeff; outline:none; transition:0.25s; }
    .input-group input:focus { border-color:#8b5cf6; background:rgba(20,15,50,0.9); box-shadow:0 0 0 5px rgba(139,92,246,0.2); }
    .input-group input::placeholder { color:#5a5090; font-weight:300; }
    .flex-row { display:flex; justify-content:space-between; align-items:center; margin:0.5rem 0 2rem 0; }
    .remember { display:flex; align-items:center; gap:8px; color:#b9b0e6; font-size:0.9rem; }
    .remember input[type="checkbox"] { width:18px; height:18px; accent-color:#7c3aed; cursor:pointer; }
    .forgot-link { color:#a78bfa; font-size:0.9rem; text-decoration:none; border-bottom:1px dashed #4f46e5; transition:0.2s; }
    .forgot-link:hover { color:#c4b5fd; }
    .btn-login { width:100%; padding:18px; border:none; border-radius:44px; font-size:1.1rem; font-weight:700;
      background:linear-gradient(135deg,#7c3aed,#4f46e5); color:white; cursor:pointer;
      box-shadow:0 10px 30px rgba(79,70,229,0.5); transition:all 0.25s; margin-bottom:2rem; }
    .btn-login:hover { transform:translateY(-3px); box-shadow:0 16px 40px rgba(79,70,229,0.7); background:linear-gradient(135deg,#8b5cf6,#6366f1); }
    .btn-login:active { transform:scale(0.97); }
    .register-section { text-align:center; color:#9ca3cf; font-size:0.95rem; }
    .register-section a { color:#a78bfa; font-weight:600; text-decoration:none; border-bottom:1px solid #4f46e5; transition:0.2s; }
    .register-section a:hover { color:#ddd6fe; }
    #loginStatus { margin-top:1.5rem; padding:12px 16px; border-radius:40px; text-align:center; font-size:0.9rem; background:rgba(0,0,0,0.5); color:#f0eeff; border-left:4px solid #7c3aed; display:none; }
    #loginStatus.error { border-left-color:#f87171; color:#fca5a5; display:block; }
    #loginStatus.success { border-left-color:#34d399; color:#a7f3d0; display:block; }
    @media (max-width:500px) { .login-card { padding:2rem 1.5rem; border-radius:36px; } .brand { font-size:1.8rem; } }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand"><span>⚡</span> VoltX</div>
  <div class="subhead">🔓 Melde dich an – deine Power wartet</div>
  <form id="loginForm">
    <div class="input-group">
      <label for="username">Benutzername</label>
      <input type="text" id="username" placeholder="z.B. volt_king" required />
    </div>
    <div class="input-group">
      <label for="password">Passwort</label>
      <input type="password" id="password" placeholder="••••••••" required />
    </div>
    <div class="flex-row">
      <label class="remember"><input type="checkbox" id="rememberMe" /> Angemeldet bleiben</label>
      <a href="#" class="forgot-link">Passwort vergessen?</a>
    </div>
    <button type="submit" class="btn-login">⚡ Einloggen</button>
  </form>
  <div class="register-section">
    Noch kein Konto? <a href="register.html" id="registerLink">Jetzt registrieren</a>
  </div>
  <div id="loginStatus"></div>
</div>
<script>
  const loginForm = document.getElementById('loginForm');
  const statusDiv = document.getElementById('loginStatus');

  function setStatus(msg, type = 'info') {
    statusDiv.textContent = msg;
    statusDiv.className = '';
    if (type === 'error') statusDiv.classList.add('error');
    else if (type === 'success') statusDiv.classList.add('success');
    statusDiv.style.display = 'block';
  }

  // ─── PRÜFEN OB BEREITS EINGELOGGT ───
  async function checkAuth() {
    try {
      const res = await fetch('http://localhost:5000/api/protected/dashboard', {
        credentials: 'include'
      });
      const data = await res.json();
      if (data.success) {
        if (data.user.username === 'LucaPicassu') {
          window.open('admin.html', '_blank');
        }
        window.location.href = 'dashboard.html';
      }
    } catch (e) {
      // Nicht eingeloggt → nichts tun
    }
  }

  // ─── LOGIN ───
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
      setStatus('Bitte alle Felder ausfüllen.', 'error');
      return;
    }

    setStatus('⏳ Authentifizierung …', 'info');

    try {
      const res = await fetch('http://localhost:5000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        setStatus(`✅ Willkommen ${data.user.username}!`, 'success');

        if (data.user.isAdmin) {
          setTimeout(() => {
            window.open('admin.html', '_blank');
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        }
      } else {
        setStatus(data.message || 'Login fehlgeschlagen.', 'error');
      }
    } catch (err) {
      setStatus('❌ Server nicht erreichbar. Backend läuft?', 'error');
    }
  });

  document.getElementById('registerLink').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = 'register.html';
  });

  checkAuth();
</script>
</body>
</html>
