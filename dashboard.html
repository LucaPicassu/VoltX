<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoltX – Dashboard</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body {
      min-height:100vh;
      background: radial-gradient(circle at 30% 20%, #0e0b2a, #04030e);
      padding:1.5rem;
      color:#f0eeff;
    }
    .container {
      max-width:1200px;
      margin:0 auto;
    }
    .header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:1rem 2rem;
      background:rgba(16,14,40,0.78);
      backdrop-filter:blur(16px);
      border:1px solid rgba(120,80,255,0.3);
      border-radius:40px;
      margin-bottom:2rem;
      flex-wrap:wrap;
      gap:1rem;
    }
    .brand {
      font-size:1.8rem;
      font-weight:800;
      background:linear-gradient(135deg,#a78bfa,#7c3aed,#4f46e5);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      cursor:pointer;
    }
    .brand:hover { opacity:0.8; }
    .user-area {
      display:flex;
      align-items:center;
      gap:1.5rem;
      flex-wrap:wrap;
    }
    .user-avatar-small {
      width:36px;
      height:36px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid #7c3aed;
      background:#1a1540;
    }
    .user-avatar-placeholder {
      font-size:1.5rem;
    }
    .user-name {
      font-weight:600;
      color:#c4b5fd;
    }
    .coins-badge {
      background:rgba(124,58,237,0.2);
      padding:6px 16px;
      border-radius:40px;
      border:1px solid #7c3aed;
      font-weight:700;
      color:#a78bfa;
    }
    .btn-logout {
      background:#ef4444;
      border:none;
      color:white;
      padding:8px 20px;
      border-radius:40px;
      cursor:pointer;
      font-weight:600;
      transition:0.25s;
    }
    .btn-logout:hover {
      background:#dc2626;
      transform:scale(1.05);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 40px;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid #4f46e5;
      transition: 0.25s;
    }
    .nav-links a:hover {
      background: #7c3aed;
      color: white;
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
    }
    .nav-links a.active {
      background: #7c3aed;
      color: white;
    }

    .content {
      background: rgba(10, 8, 30, 0.4);
      border-radius: 28px;
      padding: 2rem;
      border: 1px solid #1a1540;
    }
    .content h3 {
      color: #a78bfa;
      margin-bottom: 1.5rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: rgba(10, 8, 30, 0.6);
      border: 1px solid #2a235a;
      border-radius: 24px;
      padding: 1.5rem;
      text-align: center;
      transition: 0.25s;
    }
    .stat-card:hover {
      border-color: #7c3aed;
      transform: translateY(-4px);
    }
    .stat-card .label {
      font-size: 0.8rem;
      color: #9ca3cf;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-card .value {
      font-size: 2.2rem;
      font-weight: 800;
      margin-top: 6px;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .bonus-card {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), rgba(79, 70, 229, 0.05));
      border: 2px solid #7c3aed;
      border-radius: 24px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .bonus-card .bonus-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .bonus-card .bonus-icon {
      font-size: 2.5rem;
    }
    .bonus-card .bonus-text {
      color: #c4b5fd;
    }
    .bonus-card .bonus-text strong {
      color: #a78bfa;
      font-size: 1.2rem;
    }
    .bonus-card .bonus-text .countdown {
      color: #fca5a5;
    }
    .btn-claim {
      background: linear-gradient(135deg, #34d399, #10b981);
      border: none;
      color: #0e0b2a;
      padding: 12px 32px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: 0.25s;
      white-space: nowrap;
    }
    .btn-claim:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(52, 211, 153, 0.4);
    }
    .btn-claim:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .account-card {
      background: rgba(10, 8, 30, 0.4);
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid #2a235a;
    }
    .account-card .avatar-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }
    .account-card .avatar-row img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #7c3aed;
      object-fit: cover;
      background: #1a1540;
    }
    .account-card .avatar-row .placeholder {
      font-size: 2.5rem;
    }
    .account-card p {
      margin: 4px 0;
      color: #c4b5fd;
    }
    .account-card strong {
      color: #9ca3cf;
    }

    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    .status-dot.online {
      background: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    @media (max-width:600px) {
      .header { flex-direction:column; align-items:stretch; }
      .user-area { justify-content:space-between; }
      .nav-links a { padding:6px 14px; font-size:0.85rem; }
      .content { padding:1rem; }
      .stats-grid { grid-template-columns:1fr 1fr; }
      .bonus-card { flex-direction:column; text-align:center; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand" onclick="window.location.href='dashboard.html'">⚡ VoltX</div>
    <div class="user-area">
      <span id="headerAvatar"></span>
      <span class="user-name" id="userName">Laden...</span>
      <span class="coins-badge" id="userCoins">🪙 0</span>
      <button class="btn-logout" id="logoutBtn">🚪 Logout</button>
    </div>
  </div>

  <div class="nav-links">
    <a href="dashboard.html" class="active">📊 Dashboard</a>
    <a href="shop.html">🛒 V$ Shop</a>
    <a href="upload.html">📤 Upload</a>
    <a href="members.html">👥 Member</a>
    <a href="profile.html">👤 Profil</a>
  </div>

  <div class="content">
    <h3>📈 Übersicht</h3>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Volt Coins</div>
        <div class="value" id="statCoins">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Mitglied seit</div>
        <div class="value" style="font-size:1.2rem;" id="statSince">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Dein Rang</div>
        <div class="value" style="font-size:1.8rem;" id="statRole">User</div>
      </div>
    </div>

    <div class="bonus-card" id="bonusCard">
      <div class="bonus-info">
        <span class="bonus-icon">🎁</span>
        <div class="bonus-text">
          <strong>Täglicher Bonus</strong><br />
          <span id="bonusStatus">Lade...</span>
          <span id="bonusCountdown" class="countdown"></span>
        </div>
      </div>
      <button class="btn-claim" id="claimBtn" onclick="claimDailyBonus()">🎁 Bonus abholen</button>
    </div>

    <div id="accountSection">
      <h3>👤 Account</h3>
      <div class="account-card">
        <div class="avatar-row">
          <img id="accAvatar" src="" style="display:none;" alt="Avatar" />
          <span class="placeholder" id="accAvatarPlaceholder">👤</span>
        </div>
        <p><strong>Benutzername:</strong> <span id="accUser">-</span></p>
        <p><strong>E-Mail:</strong> <span id="accEmail">-</span></p>
        <p><strong>Coins:</strong> <span id="accCoins">0</span></p>
        <p><strong>Bio:</strong> <span id="accBio">-</span></p>
        <p><strong>Mitglied seit:</strong> <span id="accSince">-</span></p>
        <p><strong>🎁 Gesamt-Bonus:</strong> <span id="accTotalBonus">0</span> Coins</p>
        <p><strong>Status:</strong> <span id="accStatus"><span class="status-dot online"></span> Online</span></p>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:5000/api';
  let currentUser = null;
  let bonusTimer = null;

  function apiFetch(endpoint, options = {}) {
    return fetch(`${API_URL}${endpoint}`, {
      ...options,
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      }
    }).then(res => {
      if (res.status === 401) {
        window.location.href = 'login.html';
        return Promise.reject('Unauthorized');
      }
      return res.json();
    });
  }

  function renderAvatar(avatar, size = 'small') {
    if (avatar && avatar.startsWith('data:image/')) {
      if (size === 'small') {
        return `<img class="user-avatar-small" src="${avatar}" alt="Avatar" />`;
      } else {
        return `<img src="${avatar}" alt="Avatar" style="width:56px;height:56px;border-radius:50%;border:2px solid #7c3aed;object-fit:cover;background:#1a1540;" />`;
      }
    }
    if (size === 'small') {
      return `<span class="user-avatar-placeholder">👤</span>`;
    }
    return `<span style="font-size:2.5rem;">👤</span>`;
  }

  async function loadDashboard() {
    try {
      const data = await apiFetch('/protected/dashboard');
      if (data.success) {
        currentUser = data.user;
        const avatar = data.user.avatar || '';

        document.getElementById('headerAvatar').innerHTML = renderAvatar(avatar, 'small');
        document.getElementById('userName').textContent = data.user.username;
        document.getElementById('userCoins').innerHTML = `🪙 ${data.user.voltCoins}`;

        document.getElementById('statCoins').textContent = data.user.voltCoins;
        document.getElementById('statSince').textContent = new Date(data.user.createdAt).toLocaleDateString('de-DE');
        document.getElementById('statRole').textContent = data.user.username === 'LucaPicassu' ? '👑 Admin' : '⚡ Elite';

        if (avatar && avatar.startsWith('data:image/')) {
          document.getElementById('accAvatar').src = avatar;
          document.getElementById('accAvatar').style.display = 'block';
          document.getElementById('accAvatarPlaceholder').style.display = 'none';
        } else {
          document.getElementById('accAvatar').style.display = 'none';
          document.getElementById('accAvatarPlaceholder').style.display = 'inline';
        }

        document.getElementById('accUser').textContent = data.user.username;
        document.getElementById('accEmail').textContent = data.user.email;
        document.getElementById('accCoins').textContent = data.user.voltCoins;
        document.getElementById('accBio').textContent = data.user.bio || 'Keine Bio';
        document.getElementById('accSince').textContent = new Date(data.user.createdAt).toLocaleDateString('de-DE');
        document.getElementById('accStatus').innerHTML = '<span class="status-dot online"></span> Online';

        loadBonusStatus();
      }
    } catch (err) {
      console.error('Load Error:', err);
      window.location.href = 'login.html';
    }
  }

  async function loadBonusStatus() {
    try {
      const data = await apiFetch('/profile/daily-bonus-status');
      if (data.success) {
        const statusDiv = document.getElementById('bonusStatus');
        const countdownDiv = document.getElementById('bonusCountdown');
        const claimBtn = document.getElementById('claimBtn');

        if (data.canClaim) {
          statusDiv.textContent = '🎉 Bereit zum Abholen!';
          countdownDiv.textContent = '';
          claimBtn.disabled = false;
          claimBtn.textContent = '🎁 Bonus abholen';
        } else {
          statusDiv.textContent = '⏳ Nächster Bonus in:';
          countdownDiv.textContent = `${data.remainingHours} Stunden`;
          claimBtn.disabled = true;
          claimBtn.textContent = `⏳ ${data.remainingHours}h warten`;

          if (bonusTimer) clearInterval(bonusTimer);
          bonusTimer = setInterval(() => {
            const remaining = data.remainingHours - (Date.now() - new Date(data.lastBonus).getTime()) / (1000 * 60 * 60);
            if (remaining <= 0) {
              clearInterval(bonusTimer);
              loadBonusStatus();
              return;
            }
            const hours = Math.floor(remaining);
            const minutes = Math.floor((remaining - hours) * 60);
            countdownDiv.textContent = `${hours}h ${minutes}min`;
            claimBtn.textContent = `⏳ ${hours}h ${minutes}min warten`;
          }, 60000);
        }

        document.getElementById('accTotalBonus').textContent = data.totalBonus || 0;
      }
    } catch (err) {
      console.error('Load Bonus Status Error:', err);
    }
  }

  async function claimDailyBonus() {
    const claimBtn = document.getElementById('claimBtn');
    claimBtn.disabled = true;
    claimBtn.textContent = '⏳ Wird abgeholt...';

    try {
      const data = await apiFetch('/profile/daily-bonus', {
        method: 'POST'
      });

      if (data.success) {
        document.getElementById('userCoins').innerHTML = `🪙 ${data.newCoins}`;
        document.getElementById('statCoins').textContent = data.newCoins;
        document.getElementById('accCoins').textContent = data.newCoins;
        document.getElementById('accTotalBonus').textContent = data.totalBonus || 0;

        const statusDiv = document.getElementById('bonusStatus');
        statusDiv.textContent = `🎉 ${data.message}`;
        
        claimBtn.textContent = '✅ Abgeholt!';
        claimBtn.style.background = 'linear-gradient(135deg, #34d399, #10b981)';
        
        setTimeout(() => {
          loadBonusStatus();
        }, 2000);
      } else {
        alert(data.message || '❌ Fehler beim Abholen.');
        loadBonusStatus();
      }
    } catch (err) {
      alert('❌ Serverfehler.');
      loadBonusStatus();
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch(`${API_URL}/auth/logout`, {
      method: 'POST',
      credentials: 'include'
    });
    if (bonusTimer) clearInterval(bonusTimer);
    window.location.href = 'login.html';
  });

  loadDashboard();
</script>
</body>
</html>
